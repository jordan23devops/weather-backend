name: CI Pipeline

on:
  push:
    branches: [ "main", "dev" ] # Pipeline runs on push to any of these branches

jobs:
  build-and-push:
    runs-on: ubuntu-latest # Runs on a GitHub-hosted Linux server
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Pull the code from the repository

      - name: Set up Python
        uses: actions/setup-python@v5 # Set up the Python environment
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt # Install libraries for testing

      - name: Login to Docker Hub
        uses: docker/login-action@v3 # Log in to Docker Hub using secrets
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5 # Build and push the image
        with:
          context: .
          push: true
          # Use the commit SHA as the image tag (Best Practice) to avoid overwriting versions
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/weather-backend:${{ github.sha }}
